services:
  db_legacy:
    image: postgres:16
    container_name: postgres_db_legacy
    restart: always
    ports:
      - "${POSTGRES_LEGACY_PORTS}"
    environment:
      POSTGRES_USER: ${POSTGRES_LEGACY_USER}
      POSTGRES_PASSWORD: ${POSTGRES_LEGACY_PASSWORD}
      POSTGRES_DB: legacy
    volumes:
      - ./pgdata_first:/var/lib/postgresql/data
      - ./db/legacy/init:/docker-entrypoint-initdb.d:ro
      - ./shared_logs:/shared/logs
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    networks:
      - app_network


  db_clean:
    image: postgres:16
    container_name: postgres_db_clean
    restart: always
    ports:
      - "${POSTGRES_CLEAN_PORTS}"
    environment:
      POSTGRES_USER: ${POSTGRES_CLEAN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CLEAN_PASSWORD}
      POSTGRES_DB: clean
    volumes:
      - ./pgdata_second:/var/lib/postgresql/data
      - ./shared_logs:/shared/logs
    networks:
      - app_network


  db_initializer_clean:
    build:
      context: .
      dockerfile: app/Dockerfile.clean
    env_file:
      - .env
    depends_on:
      - db_clean
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_panel_web
    restart: always
    ports:
      - "${PGADMIN_PORTS}"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app_network

volumes:
  pgadmin-data:

networks:
  app_network:
    name: cdc_network
services:
  api_app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
        - .env
    container_name: faker_app
    ports:
      - "${FAST_API_PORT}:8000"
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/logs
    networks:
      - app_network

networks:
  app_network:
    external: true
    name: ${CDC_NETWORK_NAME}